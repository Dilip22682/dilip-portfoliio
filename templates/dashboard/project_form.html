<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#F1F5F9;">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h4 class="fw-bold mb-4">📁 Add Project</h4>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="fw-semibold mb-1">Project Title</label>
                            {{ form.title }}
                        </div>
                        <div class="col-12">
                            <label class="fw-semibold mb-1">Description</label>
                            {{ form.description }}
                        </div>
                        <div class="col-12">
                            <label class="fw-semibold mb-1">Tech Stack (space separated)</label>
                            {{ form.tech_stack }}
                        </div>
                        <div class="col-md-6">
                            <label class="fw-semibold mb-1">GitHub Link</label>
                            {{ form.github_link }}
                        </div>
                        <div class="col-md-6">
                            <label class="fw-semibold mb-1">Live Link</label>
                            {{ form.live_link }}
                        </div>
                        <div class="col-md-6">
                            <label class="fw-semibold mb-1">Project Image</label>
                            {{ form.image }}
                        </div>
                        <div class="col-md-3">
                            <label class="fw-semibold mb-1">Order</label>
                            {{ form.order }}
                        </div>
                        <div class="col-md-3 d-flex align-items-end pb-1">
                            <div class="form-check">
                                {{ form.featured }}
                                <label class="form-check-label fw-semibold">Featured</label>
                            </div>
                        </div>
                        <div class="col-12 mt-2">
                            <button type="submit" class="btn px-5 py-2 fw-bold"
                                style="background:#6366F1; color:#fff; border-radius:10px;">
                                + Add Project
                            </button>
                            <a href="{% url 'dashboard' %}" class="btn btn-light px-4 py-2 ms-2 rounded-3">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
