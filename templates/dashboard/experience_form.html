<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Experience</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#F1F5F9;">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h4 class="fw-bold mb-4">💼 Add Experience</h4>
                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="fw-semibold mb-1">Company</label>
                            {{ form.company }}
                        </div>
                        <div class="col-md-6">
                            <label class="fw-semibold mb-1">Position</label>
                            {{ form.position }}
                        </div>
                        <div class="col-12">
                            <label class="fw-semibold mb-1">Description</label>
                            {{ form.description }}
                        </div>
                        <div class="col-md-6">
                            <label class="fw-semibold mb-1">Start Date</label>
                            {{ form.start_date }}
                        </div>
                        <div class="col-md-6">
                            <label class="fw-semibold mb-1">End Date</label>
                            {{ form.end_date }}
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                {{ form.is_current }}
                                <label class="form-check-label fw-semibold">Currently Working Here</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn px-5 py-2 fw-bold"
                                style="background:#6366F1; color:#fff; border-radius:10px;">
                                + Add Experience
                            </button>
                            <a href="{% url 'dashboard' %}" class="btn btn-light px-4 py-2 ms-2 rounded-3">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
