<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Skill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#F1F5F9;">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h4 class="fw-bold mb-4">💻 Add Skill</h4>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="fw-semibold mb-1">Skill Name</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="fw-semibold mb-1">Category</label>
                        {{ form.category }}
                    </div>
                    <div class="mb-3">
                        <label class="fw-semibold mb-1">Percentage (0-100)</label>
                        {{ form.percentage }}
                    </div>
                    <div class="mb-3">
                        <label class="fw-semibold mb-1">Icon Class (optional)</label>
                        {{ form.icon }}
                    </div>
                    <button type="submit" class="btn px-5 py-2 fw-bold"
                        style="background:#6366F1; color:#fff; border-radius:10px;">
                        + Add Skill
                    </button>
                    <a href="{% url 'dashboard' %}" class="btn btn-light px-4 py-2 ms-2 rounded-3">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
